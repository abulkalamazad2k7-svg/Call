<!DOCTYPE html>
<html>
<head>
  <title>🔥 Firebase Live Chat</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h2 {
      color: #38bdf8;
    }

    #chatBox {
      width: 90%;
      max-width: 400px;
      height: 350px;
      margin: auto;
      background: #1e293b;
      border-radius: 10px;
      overflow-y: scroll;
      padding: 10px;
      text-align: left;
    }

    .msg {
      background: #334155;
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
    }

    input {
      padding: 10px;
      width: 60%;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
    }

    button {
      padding: 10px;
      border: none;
      background: #38bdf8;
      color: black;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

<h2>🔥 Live Firebase Chat</h2>

<div id="chatBox"></div>

<br>

<input type="text" id="username" placeholder="Your Name">
<br>
<input type="text" id="message" placeholder="Write message...">
<button onclick="sendMessage()">Send</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔥 তোমার Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDvONr_6u6-axEBOJkoVHdPf_-1ttO9Yf0",
  authDomain: "call-264ca.firebaseapp.com",
  projectId: "call-264ca",
  storageBucket: "call-264ca.firebasestorage.app",
  messagingSenderId: "896610494705",
  appId: "1:896610494705:web:07a40fef65b6ce63c1a150",
  measurementId: "G-J4TKQT9R7K"
};

// Init
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 📤 Message Send
window.sendMessage = async function() {
  const name = document.getElementById("username").value;
  const msg = document.getElementById("message").value;

  if(name === "" || msg === ""){
    alert("Name & Message required!");
    return;
  }

  await addDoc(collection(db, "messages"), {
    name: name,
    text: msg,
    time: Date.now()
  });

  document.getElementById("message").value = "";
}

// 📥 Real-time Load
const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  let html = "";

  snapshot.forEach(doc => {
    const data = doc.data();
    html += `<div class="msg"><b>${data.name}:</b> ${data.text}</div>`;
  });

  document.getElementById("chatBox").innerHTML = html;

  // Auto scroll bottom
  const box = document.getElementById("chatBox");
  box.scrollTop = box.scrollHeight;
});
</script>

</body>
</html>
