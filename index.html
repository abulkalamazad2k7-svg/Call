<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChatApp - Realtime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header Style */
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Chat Box */
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message Bubbles */
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; font-size: 16px; word-wrap: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .received { background: white; align-self: flex-start; border-top-left-radius: 2px; }
        
        /* Input Area */
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border: none; border-radius: 25px; outline: none; font-size: 16px; }
        button { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        button:active { transform: scale(0.9); }
    </style>
</head>
<body>

<header>MyChatApp (Live)</header>

<div id="chat-box">
    </div>

<div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button onclick="sendMessage()">➤</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // আপনার প্রজেক্টের সঠিক কনফিগারেশন
    const firebaseConfig = {
        apiKey: "AIzaSyBQm7czQJKWZUUZIlLYOty0nE9PCZ7JfoE",
        authDomain: "mychatapp-45d10.firebaseapp.com",
        databaseURL: "https://mychatapp-45d10-default-rtdb.firebaseio.com/",
        projectId: "mychatapp-45d10",
        storageBucket: "mychatapp-45d10.firebasestorage.app",
        messagingSenderId: "900860308133",
        appId: "1:900860308133:web:1af78880ca65c9cde33b4c"
    };

    // Firebase ইনিশিয়ালাইজ
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // মেসেজ পাঠানোর ফাংশন
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const msg = input.value.trim();
        
        if (msg !== "") {
            database.ref('messages').push().set({
                text: msg,
                timestamp: Date.now()
            });
            input.value = "";
        }
    }

    // এন্টার বাটন কাজ করার জন্য
    document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    // মেসেজ রিয়েল-টাইমে শো করার ফাংশন
    database.ref('messages').on('child_added', (snapshot) => {
        const data = snapshot.val();
        const chatBox = document.getElementById('chat-box');
        
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', 'received');
        msgDiv.innerText = data.text;
        
        chatBox.appendChild(msgDiv);
        
        // অটো স্ক্রল ডাউন
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>

</body>
</html>
