<!DOCTYPE html>
<html>
<head>
  <title>🔥 Stylish Firebase Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    h2 {
      padding: 15px;
      background: #020617;
      margin: 0;
      color: #38bdf8;
    }

    #chat {
      width: 90%;
      max-width: 400px;
      height: 400px;
      margin: 20px auto;
      background: #020617;
      border-radius: 10px;
      overflow-y: scroll;
      padding: 10px;
      text-align: left;
    }

    .msg {
      background: #1e293b;
      padding: 8px;
      margin: 6px 0;
      border-radius: 6px;
    }

    .name {
      color: #38bdf8;
      font-weight: bold;
    }

    #inputBox {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 120px;
      border-radius: 5px;
      border: none;
    }

    #msgInput {
      width: 200px;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #38bdf8;
      color: black;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

<h2>🔥 Live Chat</h2>

<div id="chat"></div>

<div id="inputBox">
  <input id="name" placeholder="Your Name">
  <input id="msgInput" placeholder="Write message">
  <button onclick="send()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvONr_6u6-axEBOJkoVHdPf_-1ttO9Yf0",
  authDomain: "call-264ca.firebaseapp.com",
  projectId: "call-264ca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// send message
window.send = async function() {
  let name = document.getElementById("name").value;
  let msg = document.getElementById("msgInput").value;

  if(!name || !msg) return alert("Fill all");

  await addDoc(collection(db, "messages"), {
    name: name,
    text: msg,
    time: Date.now()
  });

  document.getElementById("msgInput").value = "";
}

// real-time chat load
onSnapshot(collection(db, "messages"), (snap) => {
  let html = "";

  snap.forEach(doc => {
    let d = doc.data();
    html += `<div class="msg"><span class="name">${d.name}:</span> ${d.text}</div>`;
  });

  document.getElementById("chat").innerHTML = html;

  let chatBox = document.getElementById("chat");
  chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

</body>
</html>
