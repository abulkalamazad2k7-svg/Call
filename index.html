<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChatApp - Firebase</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 75%; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .received { background: white; align-self: flex-start; color: #303030; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 25px; outline: none; font-size: 16px; }
        button { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<header>MyChatApp (Live)</header>
<div id="chat-box"></div>
<div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">➤</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // আপনার স্ক্রিনশট অনুযায়ী কনফিগারেশন
    const firebaseConfig = {
        apiKey: "AIzaSyBQm7czQJKWZUUZILLYOty0nE9PCLvO67o", 
        authDomain: "mychatapp-45d10.firebaseapp.com",
        databaseURL: "https://mychatapp-45d10-default-rtdb.firebaseio.com/",
        projectId: "mychatapp-45d10",
        storageBucket: "mychatapp-45d10.appspot.com",
        messagingSenderId: "900860308133",
        appId: "1:900860308133:web:1af78880ca65c9cb69614f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // মেসেজ পাঠানো
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const msg = input.value;
        if (msg.trim() !== "") {
            database.ref('messages').push().set({
                text: msg,
                time: Date.now()
            });
            input.value = "";
        }
    }

    // এন্টার চাপলে মেসেজ যাবে
    document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    // মেসেজ রিসিভ করা
    database.ref('messages').on('child_added', (snapshot) => {
        const data = snapshot.val();
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', 'received');
        msgDiv.innerText = data.text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>

</body>
</html>
